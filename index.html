<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الماسح الذكي لروشتات التحاليل الطبية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #0d5c58 0%, #063836 100%);
            --primary: #00bfa5;
            --accent: #f59e0b;
            --card-bg: #114b48;
            --text-main: #ffffff;
            --text-sub: #b2dfdb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-main);
            padding: 20px 15px 60px;
        }

        .container { max-width: 550px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 1.35rem; font-weight: 800; margin-bottom: 5px; }
        header p { font-size: 0.85rem; color: var(--text-sub); }

        .controls-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .gender-options {
            display: flex;
            gap: 15px;
            margin-bottom: 14px;
        }

        .gender-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.88rem;
            cursor: pointer;
        }

        .upload-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-action {
            background-color: var(--primary);
            color: #00332c;
            border: none;
            padding: 11px;
            border-radius: 10px;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            display: block;
            width: 100%;
        }

        input[type="file"] { display: none; }

        /* منطقة معاينة وتدوير الصورة */
        #previewContainer {
            display: none;
            margin-top: 15px;
            text-align: center;
        }

        #imagePreview {
            max-width: 100%;
            max-height: 280px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .rotate-toolbar {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
        }

        .btn-small {
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.25);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* شاشة التحميل المشوشة */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 25, 30, 0.82);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-card {
            background: rgba(12, 30, 38, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 24px 30px;
            border-radius: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .spinner {
            width: 46px; height: 46px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* نتائج الفحص */
        .results-section { margin-top: 20px; display: none; }
        .results-section h3 { font-size: 1.05rem; margin-bottom: 12px; color: var(--accent); }

        .test-result-card {
            background: #ffffff;
            color: #263238;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            border-right: 6px solid var(--primary);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .test-result-card.warning-female { border-right-color: #e91e63; }
        .test-result-card h4 { color: #00796b; font-size: 0.98rem; margin-bottom: 5px; }
        .test-result-card p { font-size: 0.86rem; line-height: 1.55; }

        .highlight-alert {
            display: block;
            background: #ffebee;
            color: #c2185b;
            padding: 5px 8px;
            border-radius: 6px;
            font-weight: 700;
            margin-top: 6px;
            font-size: 0.82rem;
        }

        .raw-text-box {
            background: rgba(0, 0, 0, 0.25);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            color: #cfd8dc;
            margin-top: 12px;
            max-height: 100px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>الماسح الذكي لتحضيرات التحاليل</h1>
        <p>فحص الروشتة وقراءة التحاليل مع الدوران التلقائي للصور الرأسية</p>
    </header>

    <div class="controls-card">
        <div class="gender-options">
            <span style="font-weight:600; font-size:0.9rem;">الحالة:</span>
            <label><input type="radio" name="gender" value="female" checked> أنثى (Female)</label>
            <label><input type="radio" name="gender" value="male"> ذكر (Male)</label>
        </div>

        <div class="upload-area">
            <label for="cameraInput" class="btn-action">📸 فتح الكاميرا وتصوير الورقة</label>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="loadFile(this)">

            <label for="fileInput" class="btn-action" style="background-color: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.3);">📁 اختيار صورة من المعرض</label>
            <input type="file" id="fileInput" accept="image/*" onchange="loadFile(this)">
        </div>

        <div id="previewContainer">
            <img id="imagePreview" alt="معاينة الصورة">
            <div class="rotate-toolbar">
                <button class="btn-small" onclick="rotateImage(90)">🔄 تدوير 90° لليمين</button>
                <button class="btn-small" onclick="rotateImage(-90)">🔄 تدوير 90° لليسار</button>
                <button class="btn-small" style="background: var(--accent);" onclick="startOCR()">🔍 بدء الفحص الآن</button>
            </div>
        </div>
    </div>

    <!-- مؤشر التحميل -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <h3>Loading...</h3>
            <p id="loadingStatus" style="font-size: 0.85rem; color: #b2dfdb;">جارٍ معالجة الصورة وقراءة السطور...</p>
        </div>
    </div>

    <!-- قائمة النتائج -->
    <div class="results-section" id="resultsSection">
        <h3>التحاليل المكتشفة وشروط السحب:</h3>
        <div id="resultsList"></div>
        <div class="raw-text-box" id="rawText"></div>
    </div>
</div>

<canvas id="hiddenCanvas" style="display:none;"></canvas>

<script>
    let currentImage = new Image();
    let currentRotation = 0;

    // بنك تحاليل الروشتة وشروطها
    const testsDatabase = [
        {
            id: 'vitamin_d',
            name: 'فيتامين د (Vitamin D)',
            regex: /(vitamin\s*d|vaitamin\s*d|vit\s*d|v\.d)/i,
            getInstructions: (g) => g === 'female' 
                ? `يفضل إجراؤه صباحاً.<br><span class="highlight-alert">⚠️ تنبيه للحالة (أنثى): لا يتم السحب أثناء فترة البريود، ويتم السحب بعد الانتهاء منها بـ 48 ساعة.</span>`
                : `يفضل إجراؤه صباحاً مع تجنب تناول جرعات علاجية مكثفة من فيتامين د قبل الفحص بيومين.`
        },
        {
            id: 'fbs',
            name: 'سكر صائم (FBS)',
            regex: /(fasting\s*blood\s*sugar|fbs|f\.b\.s|سكر\s*صائم)/i,
            getInstructions: () => `صيام تام من 6 إلى 8 ساعات (مسموح بشرب الماء النقي فقط).`
        },
        {
            id: 'rbs',
            name: 'سكر عشوائي (Random Blood Sugar)',
            regex: /(random\s*b|rbs|random\s*sugar)/i,
            getInstructions: () => `لا يشترط الصيام، ويتم سحب العينة في أي وقت خلال اليوم.`
        },
        {
            id: 'cbc',
            name: 'صورة دم كاملة (CBC)',
            regex: /(cbc|complete\s*blood\s*picture|complete\s*blood\s*count)/i,
            getInstructions: () => `لا يشترط الصيام، ولكن يفضل شرب كمية كافية من الماء وتجنب الإجهاد البدني العنيف.`
        },
        {
            id: 'alt_ast',
            name: 'وظائف كبد (SGOT / SGPT / ALT / AST / Albumin)',
            regex: /(ast|sgot|alt|sgpt|albumin)/i,
            getInstructions: () => `لا يشترط الصيام التام، ويفضل تجنب الأغذية شديدة الدسم والكحوليات قبل التحليل بـ 24 ساعة.`
        },
        {
            id: 'kidney',
            name: 'وظائف كلى (Creatinine / BUN / Urea)',
            regex: /(creatinine|blood\s*urea|bun|urea)/i,
            getInstructions: () => `يفضل صيام خفيف من 4 إلى 6 ساعات وتجنب تناول كميات مفرطة من اللحوم الحمراء في اليوم السابق.`
        },
        {
            id: 'electrolytes',
            name: 'أملاح ومعادن الدم (Sodium / Potassium)',
            regex: /(sodium|potassium)/i,
            getInstructions: () => `لا يشترط الصيام، ولكن يجب إبلاغ المعمل بأي أدوية ضغط أو مدرات بول يتم تناولها بانتظام.`
        },
        {
            id: 'iron',
            name: 'حديد السيرم (Serum Iron)',
            regex: /(serum\s*iron|iron)/i,
            getInstructions: () => `صيام 8 إلى 12 ساعة، ويسحب صباحاً لأن مستوى الحديد يكون في أعلى مستوياته في الصباح، مع إيقاف مكملات الحديد قبلها بـ 24-48 ساعة.`
        },
        {
            id: 'urine',
            name: 'تحليل بول كامل (Complete Urine Analysis)',
            regex: /(urine\s*analysis|urine)/i,
            getInstructions: () => `عينة بول صباحية أولى في وعاء معقم، مع غسل وتطهير المنطقة، وأخذ عينة منتصف البول (Mid-stream).`
        },
        {
            id: 'stool',
            name: 'تحليل براز (Stool Analysis)',
            regex: /(stool\s*analysis|stool)/i,
            getInstructions: () => `تجمع العينة في وعاء نظيف ومعقم بدون اختلاطها بماء المرحاض أو البول وتُسلّم للمعمل خلال ساعتين.`
        },
        {
            id: 'ultrasound',
            name: 'سونار البطن والحوض (Ultrasound Abdomen & Pelvis)',
            regex: /(ultrasound|ultrasondg|pelvis|abdomen)/i,
            getInstructions: () => `صيام 6 إلى 8 ساعات عن الأكل لفحص البطن، مع شرب لتر ماء وحبس البول لامتلاء المثانة لفحص الحوض.`
        }
    ];

    function loadFile(input) {
        if (!input.files || !input.files[0]) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            currentImage.onload = () => {
                // إذا كانت الصورة رأسية أطول بكثير من عرضها، يتم تدويرها تلقائياً 90 درجة لتصبح أفقية
                currentRotation = currentImage.height > currentImage.width ? 90 : 0;
                renderPreview();
                document.getElementById('previewContainer').style.display = 'block';
                startOCR();
            };
            currentImage.src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
    }

    function rotateImage(angle) {
        currentRotation = (currentRotation + angle) % 360;
        renderPreview();
    }

    function renderPreview() {
        const canvas = document.getElementById('hiddenCanvas');
        const ctx = canvas.getContext('2d');
        const rad = (currentRotation * Math.PI) / 180;

        if (Math.abs(currentRotation) === 90 || Math.abs(currentRotation) === 270) {
            canvas.width = currentImage.height;
            canvas.height = currentImage.width;
        } else {
            canvas.width = currentImage.width;
            canvas.height = currentImage.height;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(rad);
        ctx.drawImage(currentImage, -currentImage.width / 2, -currentImage.height / 2);
        ctx.restore();

        document.getElementById('imagePreview').src = canvas.toDataURL();
    }

    function startOCR() {
        const canvas = document.getElementById('hiddenCanvas');
        const overlay = document.getElementById('loadingOverlay');
        const statusText = document.getElementById('loadingStatus');

        overlay.style.display = 'flex';
        statusText.innerText = 'جارٍ معالجة وتدوير الصورة...';

        Tesseract.recognize(canvas, 'eng', {
            logger: m => {
                if (m.status === 'recognizing text') {
                    statusText.innerText = `جارٍ فحص الروشتة: ${Math.round(m.progress * 100)}%`;
                }
            }
        }).then(({ data: { text } }) => {
            overlay.style.display = 'none';
            analyzeText(text);
        }).catch(err => {
            overlay.style.display = 'none';
            alert('حدث خطأ أثناء القراءة، جربي تدوير الصورة يدوياً واضغطي فحص.');
        });
    }

    function analyzeText(rawText) {
        const selectedGender = document.querySelector('input[name="gender"]:checked').value;
        const resultsList = document.getElementById('resultsList');
        const resultsSection = document.getElementById('resultsSection');
        const rawTextBox = document.getElementById('rawText');

        resultsList.innerHTML = '';
        rawTextBox.innerText = 'النص المكتشف:\n' + rawText.trim();

        let matched = [];
        testsDatabase.forEach(test => {
            if (test.regex.test(rawText)) {
                matched.push(test);
            }
        });

        if (matched.length > 0) {
            matched.forEach(test => {
                const card = document.createElement('div');
                const isWarning = test.id === 'vitamin_d' && selectedGender === 'female';
                card.className = `test-result-card ${isWarning ? 'warning-female' : ''}`;
                card.innerHTML = `<h4>📋 ${test.name}</h4><p>${test.getInstructions(selectedGender)}</p>`;
                resultsList.appendChild(card);
            });
        } else {
            resultsList.innerHTML = `
                <div class="test-result-card" style="border-right-color: #f59e0b;">
                    <h4>لم تظهر نصوص واضحة</h4>
                    <p>استخدمي أزرار التدوير أعلاه لجعل أسطر الكلمات أفقية، ثم اضغطي (بدء الفحص الآن).</p>
                </div>
            `;
        }

        resultsSection.style.display = 'block';
        resultsSection.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
