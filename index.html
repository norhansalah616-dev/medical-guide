    <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الماسح الذكي المدمج لتحضيرات التحاليل الطبية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #0d5c58 0%, #063836 100%);
            --primary: #00bfa5;
            --accent: #f59e0b;
            --card-bg: #114b48;
            --text-main: #ffffff;
            --text-sub: #b2dfdb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-main);
            padding: 20px 15px 60px;
        }

        .container { max-width: 550px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 22px; }
        header h1 { font-size: 1.35rem; font-weight: 800; margin-bottom: 5px; }
        header p { font-size: 0.85rem; color: var(--text-sub); }

        .controls-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 18px 16px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .gender-options { display: flex; gap: 20px; margin-bottom: 16px; align-items: center; }
        .gender-options label { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; cursor: pointer; }

        .upload-area { display: flex; flex-direction: column; gap: 10px; }
        .btn-action {
            background-color: var(--primary);
            color: #00332c;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            display: block;
            width: 100%;
            transition: 0.2s;
        }
        .btn-action:hover { opacity: 0.92; }

        input[type="file"] { display: none; }

        #previewContainer { display: none; margin-top: 15px; text-align: center; }
        #imagePreview { max-width: 100%; max-height: 240px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.2); }

        .rotate-bar {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
        }

        .btn-sub {
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.25);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 25, 30, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-card {
            background: rgba(12, 30, 38, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 25px 30px;
            border-radius: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .spinner {
            width: 48px; height: 48px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .results-section { margin-top: 20px; display: none; }
        .results-section h3 { font-size: 1.1rem; margin-bottom: 12px; color: var(--accent); }

        .source-badge {
            display: inline-block;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-sub);
        }

        .test-result-card {
            background: #ffffff;
            color: #263238;
            border-radius: 12px;
            padding: 15px 18px;
            margin-bottom: 12px;
            border-right: 6px solid var(--primary);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .test-result-card.warning-female { border-right-color: #e91e63; }
        .test-result-card h4 { color: #00796b; font-size: 1rem; margin-bottom: 6px; }
        .test-result-card p { font-size: 0.88rem; line-height: 1.6; }

        .alert-box {
            background: #ffebee;
            color: #c2185b;
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: 700;
            margin-top: 8px;
            font-size: 0.82rem;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>الماسح الذكي لتحضيرات التحاليل</h1>
        <p>نظام هجين متقدم (ذكاء اصطناعي للرؤية + ماسح محلي احتياطي)</p>
    </header>

    <div class="controls-card">
        <div class="gender-options">
            <span style="font-weight:700; font-size:0.92rem;">نوع الحالة:</span>
            <label><input type="radio" name="gender" value="أنثى" checked> أنثى (Female)</label>
            <label><input type="radio" name="gender" value="ذكر"> ذكر (Male)</label>
        </div>

        <div class="upload-area">
            <label for="cameraInput" class="btn-action">📸 فتح الكاميرا وتصوير الروشتة</label>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="loadFile(this)">

            <label for="fileInput" class="btn-action" style="background-color: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.3);">📁 اختيار صورة من المعرض</label>
            <input type="file" id="fileInput" accept="image/*" onchange="loadFile(this)">
        </div>

        <div id="previewContainer">
            <img id="imagePreview" alt="معاينة الروشتة">
            <div class="rotate-bar">
                <button class="btn-sub" onclick="rotateManual(-90)">🔄 تدوير يسار</button>
                <button class="btn-sub" onclick="rotateManual(90)">🔄 تدوير يمين</button>
                <button class="btn-sub" style="background: var(--accent);" onclick="startHybridScan()">🔍 إعادة الفحص</button>
            </div>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <h3>جاري الفحص...</h3>
            <p id="loadingMsg" style="font-size: 0.85rem; color: #b2dfdb;">تحليل الصورة واستخراج شروط التحاليل...</p>
        </div>
    </div>

    <div class="results-section" id="resultsSection">
        <div id="scanModeBadge" class="source-badge"></div>
        <h3>التحاليل المكتشفة وشروط التحضير:</h3>
        <div id="resultsList"></div>
    </div>
</div>

<canvas id="procCanvas" style="display:none;"></canvas>

<script>
    // مفتاح API مجزأ
    const _kPart1 = "QVEuQWI4Uk42STFPTkh4";
    const _kPart2 = "Y3JRUm8xMkowLTlNUVBM";
    const _kPart3 = "bm5vSTluZXhNTEhhckJY";
    const _kPart4 = "anl3aTdrd0E=";
    const getSecureKey = () => atob(_kPart1 + _kPart2 + _kPart3 + _kPart4);

    let rawImg = new Image();
    let currentAngle = 0;
    let currentFile = null;

    // بنك القواعد الطبية الشامل (يشمل الروتينية + شاشات DotCare من صفحة 3 لـ 10)
    const medicalRules = [
        // الروتينية
        {
            name: "فيتامين د (Vitamin D / 25-OH)",
            test: (t) => /vitamin\s*d|vit\s*d|v\.d|25-oh/i.test(t),
            getNotes: (isFemale) => isFemale 
                ? `يفضل إجراؤه صباحاً.<br><span class="alert-box">⚠️ تنبيه خاص بالحالة (أنثى): لا يتم السحب أثناء فترة الدورة الشهرية (البريود)، ويتم السحب بعد الانتهاء منها بـ 48 ساعة.</span>`
                : `يفضل إجراؤه صباحاً، مع تجنب تناول جرعات مكثفة من فيتامين د قبل الفحص بيومين.`
        },
        {
            name: "سكر صائم (Fasting Blood Sugar - FBS)",
            test: (t) => /\b(fbs|fasting blood sugar)\b|sugar\s*fasting/i.test(t),
            getNotes: () => `صيام تام من 6 إلى 8 ساعات كاملة (مسموح بشرب الماء النقي فقط، وممنوع التدخين أو المنبهات).`
        },
        {
            name: "سكر عشوائي (Random Blood Sugar - RBS)",
            test: (t) => /random\s*b|rbs|random.*sugar/i.test(t),
            getNotes: () => `لا يشترط الصيام، ويتم سحب العينة في أي وقت خلال اليوم.`
        },
        {
            name: "صورة دم كاملة (CBC / Complete Blood Picture)",
            test: (t) => /\bcbc\b|blood\s*picture|complete\s*blood/i.test(t),
            getNotes: () => `لا يشترط الصيام التام، ويفضل شرب كميات كافية من الماء وتجنب الإجهاد البدني العنيف قبل السحب.`
        },
        {
            name: "وظائف كبد (Albumin / SGOT / AST / SGPT / ALT)",
            test: (t) => /\b(albumin|ast|sgot|alt|sgpt)\b/i.test(t),
            getNotes: () => `لا يشترط الصيام التام، ويفضل تجنب الأطعمة الدسمة في الوجبة السابقة للسحب مباشرة.`
        },
        {
            name: "وظائف كلى (Creatinine / BUN / Blood Urea Nitrogen)",
            test: (t) => /creatinin|creat\b|\bbun\b|blood\s*urea/i.test(t),
            getNotes: () => `يفضل صيام خفيف من 4 إلى 6 ساعات، مع تجنب تناول كميات مفرطة من اللحوم الحمراء قبل الفحص بيوم.`
        },
        {
            name: "أملاح ومعادن الدم (Sodium / Potassium)",
            test: (t) => /potassium|sodium/i.test(t),
            getNotes: () => `لا يشترط الصيام، ولكن يلزم إبلاغ المعمل بأي أدوية ضغط أو مدرات بول تؤخذ بانتظام.`
        },
        {
            name: "حديد السيرم (Serum Iron)",
            test: (t) => /serum\s*iron|\biron\b/i.test(t),
            getNotes: () => `صيام من 8 إلى 12 ساعة، ويسحب صباحاً في وقت مبكر لتجنب التغير اليومي لمستوى الحديد.`
        },
        {
            name: "تحليل بول كامل (Complete Urine Analysis)",
            test: (t) => /urine|urinalysis/i.test(t),
            getNotes: () => `عينة بول صباحية أولى، مع غسل المنطقة وتطهيرها بالماء، وأخذ عينة منتصف البول (Mid-stream) في عبوة معقمة.`
        },
        {
            name: "تحليل براز (Stool Analysis)",
            test: (t) => /stool/i.test(t),
            getNotes: () => `تجمع العينة في الوعاء المعقم بدون اختلاطها بماء المرحاض أو البول، وتُسلم للمختبر خلال ساعتين كحد أقصى.`
        },
        {
            name: "سونار البطن والحوض (Ultrasound Abdomen & Pelvis)",
            test: (t) => /ultrasound|ultrason|abdomen.*pelvis|pelvis/i.test(t),
            getNotes: () => `صيام 6 إلى 8 ساعات عن الأكل لفحص البطن، وشرب لتر ماء وحبس البول لامتلاء المثانة لفحص الحوض.`
        },
        {
            name: "إنزيم محول للأنجيوتنسين (ACE)",
            test: (t) => /\bace\b|angiotensin/i.test(t),
            getNotes: () => `صيام 8 إلى 12 ساعة (مسموح بالماء فقط). يمنع تناول أدوية الضغط المثبطة للإنزيم (ACE inhibitors) إلا بعد مراجعة الطبيب.`
        },

        // DotCare
        {
            name: "فوسفاتيز حمضي (ACID PHOSPHATASE) [204003]",
            test: (t) => /acid\s*phosphatase|204003|\bacp\b/i.test(t),
            getNotes: () => `يفضل صيام خفيف (4 إلى 6 ساعات). يمنع فحص أو تدليك البروستاتا قبل التحليل بـ 48 ساعة.`
        },
        {
            name: "هرمون موجه قشر الكظر مسائي (ACTH P.M) [2100010]",
            test: (t) => /acth\s*\(?p\.?m\)?|2100010/i.test(t),
            getNotes: () => `يسحب مساءً بدقة (4 - 8 مساءً) مع راحة تامة للمريض لمدة 30 دقيقة قبل السحب وتُنقل العينة مثلجة فوراً.`
        },
        {
            name: "هرمون موجه قشر الكظر صباحي (ACTH MORNING) [210004]",
            test: (t) => /acth\s*morning|acth\s*\(?a\.?m\)?|210004/i.test(t),
            getNotes: () => `يسحب صباحاً بدقة (8 - 10 صباحاً) مع راحة تامة 30 دقيقة وتجنب التوتر، وتُنقل العينة مثلجة فوراً.`
        },
        {
            name: "مقاومة البروتين سي المنشط (ACTIVATED PROTEIN C RESISTANCE) [209001]",
            test: (t) => /activated\s*protein\s*c|apcr|209001/i.test(t),
            getNotes: () => `لا يشترط الصيام التام. يمنع أخذ أدوية السيولة ومضادات التخثر إلا بتعليمات الطبيب المعالج.`
        },
        {
            name: "أداليموماب والأجسام المضادة (Adalimumab Trough level) [Root LABService290]",
            test: (t) => /adalimumab|humira/i.test(t),
            getNotes: () => `تسحب العينة قبل موعد جرعة الدواء التالية مباشرة (Trough Level) لقياس أدنى تركيز في الدم بدقة.`
        },
        {
            name: "إنزيم أدامتس (ADAMTS13) [3035710]",
            test: (t) => /adamts/i.test(t),
            getNotes: () => `يفضل أخذ العينة قبل البدء في نقل البلازما أو أخذ العلاجات المثبطة للمناعة.`
        },
        {
            name: "أدينوزين ديميناز (ADENOSINE-DEAMINASE) [204004]",
            test: (t) => /adenosine-?deaminase|\bada\b|204004/i.test(t),
            getNotes: () => `لا يشترط الصيام. ترسل العينة للمختبر فوراً وتفصل سريعاً لتفادي تحلل الإنزيم.`
        },
        {
            name: "الهرمون المانع لإدرار البول (ADH) [210005]",
            test: (t) => /\badh\b|antidiuretic|vasopressin|210005/i.test(t),
            getNotes: () => `صيام 8 إلى 12 ساعة مع الامتناع عن التدخين والمنبهات، وتحديد كمية السوائل حسب إرشادات الطبيب.`
        },
        {
            name: "أجسام مضادة لقشرة الكظر (Adrenal cortical antibodies) [Root LABService289]",
            test: (t) => /adrenal\s*cortical/i.test(t),
            getNotes: () => `لا يشترط الصيام التام، ويفضل تجنب الأطعمة الدسمة قبل السحب بعدة ساعات.`
        },
        {
            name: "زلال سائل الاستسقاء (ALBUMIN IN ASCITIC FLUID) [Root LABService77]",
            test: (t) => /albumin\s*in\s*ascitic/i.test(t),
            getNotes: () => `عينة سائل استسقاء تجمع بمعرفة الطبيب، وترسل فوراً للمختبر مع عينة دم متزامنة لحساب SAAG.`
        },
        {
            name: "زلال البول النوعي (ALBUMIN IN URINE [QUALITATIVE]) [221003]",
            test: (t) => /albumin\s*in\s*urine|221003/i.test(t),
            getNotes: () => `عينة بول صباحية أولى نظيفة، مع تجنب التمارين الرياضية الشاقة قبل التحليل.`
        },
        {
            name: "نسبة الزلال إلى الجلوبيولين (A/G RATIO) [2040018]",
            test: (t) => /albumin\/\s*globulin|a\/g\s*ratio|2040018/i.test(t),
            getNotes: () => `لا يشترط الصيام، ويفضل تجنب الوجبات الدسمة قبل سحب الدم مباشرة.`
        },
        {
            name: "نسبة الزلال إلى الكرياتينين في البول (ALBUMIN/CREATININE RATIO) [221004]",
            test: (t) => /albumin\/creatinine|\bacr\b|microalbumin|221004/i.test(t),
            getNotes: () => `عينة بول صباحية أولى نظيفة، وتجنب الإجهاد العضلي الشديد قبل الفحص بـ 24 ساعة.`
        },
        {
            name: "كحول الدم (ALCOHOL IN BLOOD) [207001]",
            test: (t) => /alcohol\s*in\s*blood|207001/i.test(t),
            getNotes: () => `تنبيه هام: يمنع تطهير موضع الوخز بمسحات الكحول الطبية ويستبدل بمطهر آخر كاليود أو الماء والصابون.`
        },
        {
            name: "كحول اللعاب (ALCOHOL IN SALIVA) [207002]",
            test: (t) => /alcohol\s*in\s*saliva|207002/i.test(t),
            getNotes: () => `الامتناع عن الأكل، الشرب، التدخين، وغسول الفم لمدة 15 إلى 20 دقيقة قبل أخذ المسحة.`
        },
        {
            name: "كحول البول (Alcohol in urine) [Root LABService15]",
            test: (t) => /alcohol\s*in\s*urine/i.test(t),
            getNotes: () => `عينة بول نظيفة في عبوة محكمة الإغلاق لمنع تطاير الكحول، وتسلم للمختبر فوراً.`
        },
        {
            name: "إنزيم ألدولاز (ALDOLASE) [204006]",
            test: (t) => /aldolase|204006/i.test(t),
            getNotes: () => `صيام 8 إلى 12 ساعة، مع الراحة التامة وتجنب أي مجهود عضلي أو تمارين قبل السحب.`
        },
        {
            name: "هرمون ألدوستيرون (ALDOSTERONE) [210006]",
            test: (t) => /aldosterone|210006/i.test(t),
            getNotes: () => `الراحة والجلوس بهدوء 30 دقيقة قبل السحب، ومراجعة أدوية الضغط مع الطبيب.`
        },
        {
            name: "نسبة الألدوستيرون إلى الرينين (ALDOSTERONE RENIN RATIO) [204007]",
            test: (t) => /aldosterone\s*renin|\barr\b|204007/i.test(t),
            getNotes: () => `تسحب صباحاً بعد الاستيقاظ بساعتين على الأقل، مع الراحة التامة 20 دقيقة قبل الفحص.`
        },
        {
            name: "فوسفاتاز قلوي (ALKALINE PHOSPHATASE - ALP) [204008]",
            test: (t) => /alkaline\s*phosphatase|\balp\b|204008/i.test(t),
            getNotes: () => `صيام 8 إلى 10 ساعات ويفضل سحبه صباحاً لتفادي ارتفاع الإنزيم بعد الوجبات الدسمة.`
        },
        {
            name: "ألفا جلوكوزيداز في السائل المنوي (ALPHA GLUCOSIDASE) [Root LABService80]",
            test: (t) => /alpha\s*glucosidase/i.test(t),
            getNotes: () => `عينة سائل منوي معقمة، يشترط الامتناع عن القذف لمدة 3 إلى 5 أيام قبل التحليل.`
        },
        {
            name: "ألفا 1 ميكروجلوبيولين (ALPHA-1 MICROGLOBULIN) [204010]",
            test: (t) => /alpha-?1\s*microglobulin|204010/i.test(t),
            getNotes: () => `لا يشترط الصيام لعينة الدم، أما في عينة البول فتؤخذ عينة صباحية أولى نظيفة.`
        },
        {
            name: "ألفا 1 أنتي تريبسين (ALPHA-1-ANTITRYPSIN) [204009]",
            test: (t) => /alpha-?1-?antitrypsin|\baat\b|204009/i.test(t),
            getNotes: () => `يفضل صيام 4 إلى 8 ساعات، وتجنب إجرائه أثناء نزلات البرد والالتهابات الحادة.`
        },
        {
            name: "ألفا فيتو بروتين (ALPHA-FETOPROTEIN [AFP]) [220001]",
            test: (t) => /alpha-?fetoprotein|\bafp\b|220001/i.test(t),
            getNotes: () => `لا يشترط الصيام. إذا كان لمتابعة الحمل فيجب تسجيل العمر الجنيني وتاريخ آخر دورة.`
        },
        {
            name: "مستوى الألومنيوم في الدم (ALUMINIUM LEVEL) [Root LABService81]",
            test: (t) => /aluminium|aluminum/i.test(t),
            getNotes: () => `يمنع تناول أدوية الحموضة المحتوية على ألومنيوم قبل الفحص بيوم، وتسحب في أنبوبة خالية من المعادن.`
        },
        {

// دالة البحث والفلترة السريعة في ملف التهيئة
function findDotCareTest(query) {
    if (!query) return null;
    return DOTCARE_ACTIVE_TESTS.find(item => item.test(query));
}
    ];

    function loadFile(input) {
        if (!input.files || !input.files[0]) return;
        currentFile = input.files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            rawImg.onload = () => {
                currentAngle = 0;
                applyCanvasTransform();
                document.getElementById('previewContainer').style.display = 'block';
                startHybridScan();
            };
            rawImg.src = e.target.result;
        };
        reader.readAsDataURL(currentFile);
    }

    function rotateManual(deg) {
        currentAngle = (currentAngle + deg) % 360;
        applyCanvasTransform();
    }

    function applyCanvasTransform() {
        const cvs = document.getElementById('procCanvas');
        const ctx = cvs.getContext('2d');
        const rad = (currentAngle * Math.PI) / 180;

        if (Math.abs(currentAngle) === 90 || Math.abs(currentAngle) === 270) {
            cvs.width = rawImg.height;
            cvs.height = rawImg.width;
        } else {
            cvs.width = rawImg.width;
            cvs.height = rawImg.height;
        }

        ctx.clearRect(0, 0, cvs.width, cvs.height);
        ctx.save();
        ctx.translate(cvs.width / 2, cvs.height / 2);
        ctx.rotate(rad);
        ctx.drawImage(rawImg, -rawImg.width / 2, -rawImg.height / 2);
        ctx.restore();

        document.getElementById('imagePreview').src = cvs.toDataURL();
    }

    // الدالة الهجينة المركزية
    async function startHybridScan() {
        const overlay = document.getElementById('loadingOverlay');
        const msg = document.getElementById('loadingMsg');
        overlay.style.display = 'flex';

        const cvs = document.getElementById('procCanvas');
        const base64Data = cvs.toDataURL('image/jpeg', 0.85).split(',')[1];
        const mimeType = 'image/jpeg';

        msg.innerText = "فحص متقدم بالذكاء الاصطناعي (Gemini 3.6 Flash)...";
        const aiSuccess = await tryGeminiVision(base64Data, mimeType);

        if (!aiSuccess) {
            msg.innerText = "التحول التلقائي للماسح المحلي وقواعد DotCare...";
            await runLocalTesseractFallback();
        }

        overlay.style.display = 'none';
    }

    // 1. المحرك الرئيسي: الذكاء الاصطناعي السحابي
    async function tryGeminiVision(base64Image, mimeType) {
        const gender = document.querySelector('input[name="gender"]:checked').value;
        const promptText = `
أنت استشاري تحاليل طبية وخبير بنظام DotCare.
المهمة:
1. افحص الصورة بدقة واقرأ كافة التحاليل المكتوبة فيها (بما في ذلك خط اليد أو المطبوع أو المائل أو الباهت).
2. طابق الفحوصات مع قواعد التحضير المخبرية (صيام، مواعيد سحب، شروط سوائل، احترازات أدوية).
3. حالة المريض: [${gender}].
   - إذا تم رصد تحليل Vitamin D والحالة (أنثى): ضع تنبيهاً واضحاً (لا يتم السحب أثناء فترة الدورة الشهرية، ويتم السحب بعد الانتهاء منها بـ 48 ساعة).
   - إذا كان التحليل يتطلب صياماً حدد ساعاته وشرب الماء فقط.

أخرج النتيجة بصيغة JSON Array نقية دون أي markdown:
[
  {
    "test_name": "اسم الفحص بالعربية والإنجليزية واختصاره",
    "instructions": "شروط التحضير والسحب بالتفصيل",
    "is_critical_female": true
  }
]`;

        // استخدام الموديل الأحدث المطلوب من سيرفر جوجل
        const models = ["gemini-3.6-flash", "gemini-flash-latest"];

        for (const model of models) {
            try {
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${getSecureKey()}`;
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: promptText },
                                { inlineData: { mimeType: mimeType, data: base64Image } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                if (response.ok && data.candidates && data.candidates[0].content) {
                    let text = data.candidates[0].content.parts[0].text;
                    text = text.replace(/```json/g, '').replace(/```/g, '').trim();
                    const results = JSON.parse(text);
                    if (Array.isArray(results) && results.length > 0) {
                        displayResults(results, "✨ تم الفحص بنجاح عبر محرك الذكاء الاصطناعي (Gemini Vision)");
                        return true;
                    }
                }
            } catch (err) {
                console.warn("AI Engine attempt failed:", err);
            }
        }
        return false;
    }

    // 2. المحرك الاحتياطي المحلي في حال غياب الاتصال أو تعثر السيرفر
    async function runLocalTesseractFallback() {
        const cvs = document.getElementById('procCanvas');
        try {
            const result = await Tesseract.recognize(cvs, 'eng');
            const extractedText = result.data.text;

            const isFemale = document.querySelector('input[name="gender"]:checked').value === 'أنثى';
            const matched = medicalRules.filter(rule => rule.test(extractedText));

            if (matched.length > 0) {
                const formatted = matched.map(item => ({
                    test_name: item.name,
                    instructions: item.getNotes(isFemale),
                    is_critical_female: item.name.includes("Vitamin D") && isFemale
                }));
                displayResults(formatted, "🛡️ تم الفحص عبر المحرك المحلي الاحتياطي وقاعدة DotCare");
            } else {
                displayResults([], "المحرك المحلي لم يكتشف تحاليل واضحة، يرجى تعديل زاوية الصورة وإعادة الفحص.");
            }
        } catch (e) {
            alert("تعذر قراءة الصورة بالوسيلتين. يرجى التأكد من جودة الصورة.");
        }
    }

    function displayResults(tests, badgeText) {
        const badge = document.getElementById('scanModeBadge');
        const listDiv = document.getElementById('resultsList');
        const sec = document.getElementById('resultsSection');

        badge.innerText = badgeText;
        listDiv.innerHTML = '';

        if (!Array.isArray(tests) || tests.length === 0) {
            listDiv.innerHTML = '<div class="test-result-card"><p>لم يتم العثور على تحاليل مطابقة، يرجى تدوير الصورة لتصبح أفقية والضغط على (إعادة الفحص).</p></div>';
        } else {
            tests.forEach(item => {
                const card = document.createElement('div');
                card.className = `test-result-card ${item.is_critical_female ? 'warning-female' : ''}`;
                card.innerHTML = `
                    <h4>📋 ${item.test_name}</h4>
                    <p>${item.instructions}</p>
                    ${item.is_critical_female ? '<div class="alert-box">⚠️ تنبيه خاص بالحالة (أنثى): مراعاة موعد الدورة الشهرية (السحب بعدها بـ 48 ساعة)</div>' : ''}
                `;
                resultsList.appendChild(card);
            });
        }

        sec.style.display = 'block';
        sec.scrollIntoView({ behavior: 'smooth' });
    }
