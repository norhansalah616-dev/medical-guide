<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الماسح الذكي لتحضيرات التحاليل الطبية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #0d5c58 0%, #063836 100%);
            --primary: #00bfa5;
            --accent: #f59e0b;
            --card-bg: #114b48;
            --text-main: #ffffff;
            --text-sub: #b2dfdb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-main);
            padding: 20px 15px 60px;
        }

        .container { max-width: 550px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 22px; }
        header h1 { font-size: 1.35rem; font-weight: 800; margin-bottom: 5px; }
        header p { font-size: 0.85rem; color: var(--text-sub); }

        .controls-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 18px 16px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .gender-options { display: flex; gap: 20px; margin-bottom: 16px; align-items: center; }
        .gender-options label { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; cursor: pointer; }

        .upload-area { display: flex; flex-direction: column; gap: 10px; }
        .btn-action {
            background-color: var(--primary);
            color: #00332c;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            display: block;
            width: 100%;
        }

        input[type="file"] { display: none; }

        #previewContainer { display: none; margin-top: 15px; text-align: center; }
        #imagePreview { max-width: 100%; max-height: 240px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.2); }

        .rotate-bar {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
        }

        .btn-sub {
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.25);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* نافذة التحميل المشوشة */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 25, 30, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-card {
            background: rgba(12, 30, 38, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 25px 30px;
            border-radius: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .spinner {
            width: 48px; height: 48px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* نتائج الفحص */
        .results-section { margin-top: 20px; display: none; }
        .results-section h3 { font-size: 1.1rem; margin-bottom: 12px; color: var(--accent); }

        .test-result-card {
            background: #ffffff;
            color: #263238;
            border-radius: 12px;
            padding: 15px 18px;
            margin-bottom: 12px;
            border-right: 6px solid var(--primary);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .test-result-card.warning-female { border-right-color: #e91e63; }
        .test-result-card h4 { color: #00796b; font-size: 1rem; margin-bottom: 6px; }
        .test-result-card p { font-size: 0.88rem; line-height: 1.6; }

        .alert-box {
            background: #ffebee;
            color: #c2185b;
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: 700;
            margin-top: 8px;
            font-size: 0.82rem;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>الماسح الذكي لتحضيرات التحاليل</h1>
        <p>فحص وقراءة فورية للروشتات دون الحاجة لأي مفاتيح أو اشتراكات</p>
    </header>

    <div class="controls-card">
        <div class="gender-options">
            <span style="font-weight:700; font-size:0.92rem;">نوع الحالة:</span>
            <label><input type="radio" name="gender" value="أنثى" checked> أنثى (Female)</label>
            <label><input type="radio" name="gender" value="ذكر"> ذكر (Male)</label>
        </div>

        <div class="upload-area">
            <label for="cameraInput" class="btn-action">📸 فتح الكاميرا وتصوير الروشتة</label>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="loadFile(this)">

            <label for="fileInput" class="btn-action" style="background-color: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.3);">📁 اختيار صورة من المعرض</label>
            <input type="file" id="fileInput" accept="image/*" onchange="loadFile(this)">
        </div>

        <div id="previewContainer">
            <img id="imagePreview" alt="معاينة الروشتة">
            <div class="rotate-bar">
                <button class="btn-sub" onclick="rotateManual(-90)">🔄 تدوير يسار</button>
                <button class="btn-sub" onclick="rotateManual(90)">🔄 تدوير يمين</button>
                <button class="btn-sub" style="background: var(--accent);" onclick="startScan()">🔍 إعادة الفحص</button>
            </div>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <h3>Loading...</h3>
            <p id="loadingMsg" style="font-size: 0.85rem; color: #b2dfdb;">جارٍ معالجة الروشتة وتدوير الأسطر...</p>
        </div>
    </div>

    <div class="results-section" id="resultsSection">
        <h3>التحاليل المكتشفة وشروط التحضير:</h3>
        <div id="resultsList"></div>
    </div>
</div>

<canvas id="procCanvas" style="display:none;"></canvas>

<script>
    let rawImg = new Image();
    let currentAngle = 0;

    // بنك تحاليل DotCare المعتمدة مع كافة الاختصارات
    const medicalRules = [
        {
            name: "فيتامين د (Vitamin D / 25-OH)",
            keys: ["vitamin d", "vaitamin", "vit d", "v.d", "25-oh"],
            getNotes: (isFemale) => isFemale 
                ? `يفضل إجراؤه صباحاً.<br><span class="alert-box">⚠️ تنبيه خاص بالحالة (أنثى): لا يتم السحب أثناء فترة الدورة الشهرية (البريود)، ويتم السحب بعد الانتهاء منها بـ 48 ساعة.</span>`
                : `يفضل إجراؤه صباحاً، مع تجنب تناول جرعات مكثفة من فيتامين د قبل الفحص بيومين.`
        },
         {
            name: "( 24 HOURS URINE CATECHOLAMINE-VMA (Vanillylmandelic Acid)-Urine Metanephrines)",
            keys: ["DA (Dopamine - الدوبامين)", "NE (Norepinephrine - النورأدرينالين)", "Epi (Epinephrine - الأدرينالين)", "VMA (Vanillylmandelic Acid)","Metanephrine in urine","Urine Metanephrines","MNs"," MET للميتانيفرين","NMN للنورميتانفرين", "CATECHOLAMINE in urine","VMA (Vanillylmandelic Acid)"],
            getNotes: () => `*يتم تجميع عينة بول 24 ساعة.                                                                                           
                             *يجب الامتناع عن تناول المأكولات التى تحتوى على الفانيليا, الموز,المكسرات, الشاى, الكافيين, الشيكولاتة لمدة 3-4 ايام قبل التجميع.                                                                         
                             * يجب ايقاف الأدوية التالية (قطرات الأنف ,عقاقير الكحة, موسعات الشعب الهوائية , مثبطات الشهية, أدوية الاكتئاب, أدوية الضغط (الا أراد الطبيب غير ذلك) لمدة 3-4 أيام قبل التجميع.
                             *يتم تجميع البول فى وعاء نظيف وجاف يتم استلامه من المعمل.                                    
                             *يقوم المريض بافراغ المثانة فى دورة المياه ويتم تسجيل الوقت ويكون هذا وقت البداية ثم يتم تجميع كل البول حتى اليوم التالى فى نفس ميعاد البداية مع الحرص على عدم فقد اى عينة ويفضل وضع الوعاء فى الثلاجة طول فترة التجميع ولحين احضار الوعاء الى المعمل.   
                             *يجب أن تصل العينة الي المعمل بعد ساعتين كحد أقصى من الانتهاء من التجميع.`
        },
          {
            name: " أمراض مناعية للذائبة (ANTI DOUBLE STRANADED DNA )",
            keys: ["A DS D N A", "ANTI DOUBLE STRANADED DNA TITER", "Anti DNA (IF)", "Anti DNA-Ds","تحليل الذئبة","الامراض المناعية للذئبة"],
            getNotes: () => `ليس لها شروط والاستلام خلال اسبوع `
        },
         {
            name: " أمراض مناعية للروماتويد (Antinuclear Antibody)",
            keys: ["ANA immunoplot / microblot", "A.N.A", "تحليل امراض مناعية للروماتويد", "Antinuclear Antibody","ANA ( by ELISA )","ANA (by IF)","NA Profile-ENA Profile"],
            getNotes: () => `ليس لها شروط والاستلام خلال اسبوع`
        },
         {
            name: " أمراض مناعية (AMA ( Anti Mitochondrial Ab) )",
            keys: ["AMA ( Anti Mitochondrial Ab)", "A.M.A"],
            getNotes: () => `ليس لها شروط والاستلام من 5ايام لاسبوع`
        },
         {
            name: " أمراض مناعية (ASMA ( Anti-smooth muscle antibody ))",
            keys: ["ASMA ( Anti-smooth muscle antibody )", "A.SM.A"],
            getNotes: () => `ليس لها شروط والاستلام من 5ايام لاسبوع`
        },
         {
            name: "أمراض الرئة والمناعة ( ACE (ANGIOTENSIN CONVERTING ENZYME) )",
            keys: ["ACE", "S-ACE", "ANGIOTENSIN CONVERTING ENZYME", ""],
            getNotes: () => `ليس لها شروط والاستلام من 3 ل5 ايام`
        },
         {
            name: " هرمون الغدة الجار الكظرية(ACTH (AM)/ACTH (P.M))",
            keys: ["ACTH MORNING", "ACTH(AM)", "acth(am)","ACTH (P.M)","ACTH (PM)","acth(pm)"],
            getNotes: () => `يتم سحب عينة الدم من الساعة الثامنة صباحا او مساءا (يجب ألا يتعدى السحب الساعة التاسعة) ولا يشترط صيام.`
        },
        {
            name: "فوسفاتيز حمضي (ACID PHOSPHATASE)",
            keys: ["acid phosphatase", "204003", "acp"],
            getNotes: () => `يفضل صيام خفيف (4 إلى 6 ساعات). يمنع لمس أو فحص البروستاتا قبل التحليل بـ 48 ساعة لتجنب الارتفاع الكاذب للإنزيم.`
        },
        {
            name: "مقاومة البروتين سي المنشط (ACTIVATED PROTEIN C RESISTANCE)",
            keys: ["activated protein c resistance", "apcr", "209001", "apc resistance"],
            getNotes: () => `لا يشترط الصيام التام. يشترط عدم تناول أدوية السيولة ومضادات التخثر (مثل الهيبارين أو الوارفارين) إلا بتعليمات الطبيب المعالج.
                             مطلوب الشكوى والسن وبالنسبة للسيدات هل يوجد حمل ؟
                             هل يوجد عالج سيولة واسم العالج ؟ `
        },
        {
            name: "أداليموماب والأجسام المضادة (Adalimumab Trough level and Anti Adalimumab Antibody level)",

        },
        {
            name: "فحص نشاط إنزيم أدامتس (ADAMTS13)",
            keys: ["adamts13", "adamts 13", "3035710", "adamts"],

        },
        {
            name: "إنزيم أدينوزين ديميناز (ADENOSINE-DEAMINASE)",

        },
        {
            name: "الهرمون المانع لإدرار البول (ADH)",
            keys: ["adh", "210005", "antidiuretic hormone", "vasopressin"],

        },
        {
            name: "أجسام مضادة لقشرة الكظر (Adrenal cortical antibodies)",
            keys: ["adrenal cortical antibodies", "labservice289", "aca", "adrenal antibodies"],

        },
        {
            name: "زلال الدم (ALBUMIN)",
            keys: ["albumin", "204005", "البومين", "البيومين"],
            getNotes: () => `لا يشترط الصيام التام، ويفضل تجنب الأغذية عالية الدسم والبروتين قبل إجراء الفحص مباشرة.`
        },
        {
            name: "زلال سائل الاستسقاء (ALBUMIN IN ASCITIC FLUID)",
            keys: ["albumin in ascitic fluid", "ascitic fluid albumin", "labservice77"],
            getNotes: () => `عينة سائل استسقاء بريتوني يتم سحبها تحت إشراف طبي معقم، وتُرسل للمختبر فوراً مع عينة دم متزامنة لحساب نسبة SAAG.`
        },
        {
            name: "زلال البول النوعي (ALBUMIN IN URINE [QUALITATIVE])",
            keys: ["albumin in urine", "urine albumin", "221003", "زلال البول"],
            getNotes: () => `يفضل عينة بول صباحية أولى بعد تنظيف وتطهير المنطقة بالماء، مع تجنب التمارين الرياضية الشاقة قبل الفحص.`
        },
        {
            name: "نسبة الزلال إلى الجلوبيولين (ALBUMIN/ GLOBULIN RATIO [A/G])",

        },
        {
            name: "نسبة الزلال إلى الكرياتينين في البول (ALBUMIN/CREATININE RATIO - ACR)",
            keys: ["albumin/creatinine ratio", "acr", "221004", "microalbumin"],
            getNotes: () => `عينة بول صباحية عشوائية نظيفة (يفضل الأولى)، ويجب تجنب بذل مجهود عضلي عنيف قبل الفحص بـ 24 ساعة، وتجنب الفحص في حالات الحمى الشديدة.`
        },
        {
            name: "كحول الدم (ALCOHOL IN BLOOD)",
            keys: ["alcohol in blood", "blood alcohol", "207001", "etoh"],
            getNotes: () => `سحب عينة دم وريدي، وتنبيه صارم: يُمنع استخدام الكحول أو مسحات الإيثانول لتطهير الجلد قبل وخز الإبرة ويُستبدل بمطهر آخر كاليود أو الماء والصابون.`
        },
        {
            name: "كحول اللعاب (ALCOHOL IN SALIVA)",

        },
        {
            name: "كحول البول (Alcohol in urine)",

        },
        {

        },
        {

            keys: ["ultrasound", "ultrasondg", "abdomen", "pevis", "pelvis", "سونار"],
            getNotes: () => `صيام 6 إلى 8 ساعات عن الأكل لفحص البطن، وشرب لتر ماء وحبس البول لامتلاء المثانة لفحص الحوض.`
        }
    ];

    function loadFile(input) {
        if (!input.files || !input.files[0]) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            rawImg.onload = () => {
                // إذا كانت الصورة رأسية مثل صورتك، يدورها المحرك 90 درجة تلقائياً لتصبح أفقية ومقروءة
                currentAngle = rawImg.height > rawImg.width ? 90 : 0;
                applyCanvasTransform();
                document.getElementById('previewContainer').style.display = 'block';
                startScan();
            };
            rawImg.src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
    }

    function rotateManual(deg) {
        currentAngle = (currentAngle + deg) % 360;
        applyCanvasTransform();
        startScan();
    }

    function applyCanvasTransform() {
        const cvs = document.getElementById('procCanvas');
        const ctx = cvs.getContext('2d');
        const rad = (currentAngle * Math.PI) / 180;

        if (Math.abs(currentAngle) === 90 || Math.abs(currentAngle) === 270) {
            cvs.width = rawImg.height;
            cvs.height = rawImg.width;
        } else {
            cvs.width = rawImg.width;
            cvs.height = rawImg.height;
        }

        ctx.clearRect(0, 0, cvs.width, cvs.height);
        ctx.save();
        ctx.translate(cvs.width / 2, cvs.height / 2);
        ctx.rotate(rad);
        ctx.drawImage(rawImg, -rawImg.width / 2, -rawImg.height / 2);
        ctx.restore();

        document.getElementById('imagePreview').src = cvs.toDataURL();
    }

    function startScan() {
        const cvs = document.getElementById('procCanvas');
        const overlay = document.getElementById('loadingOverlay');
        const msg = document.getElementById('loadingMsg');

        overlay.style.display = 'flex';
        msg.innerText = 'جارٍ فحص الروشتة وقراءة التحاليل...';

        Tesseract.recognize(cvs, 'eng', {
            logger: m => {
                if (m.status === 'recognizing text') {
                    msg.innerText = `جارٍ القراءة: ${Math.round(m.progress * 100)}%`;
                }
            }
        }).then(({ data: { text } }) => {
            overlay.style.display = 'none';
            parseAndShow(text);
        }).catch(() => {
            overlay.style.display = 'none';
            alert('يرجى التأكد من وضوح الصورة وإعادة المحاولة.');
        });
    }

    function parseAndShow(extractedText) {
        const lower = extractedText.toLowerCase();
        const isFemale = document.querySelector('input[name="gender"]:checked').value === 'أنثى';
        const listDiv = document.getElementById('resultsList');
        const sec = document.getElementById('resultsSection');

        listDiv.innerHTML = '';
        let found = [];

        medicalRules.forEach(rule => {
            const matched = rule.keys.some(k => lower.includes(k));
            if (matched) found.push(rule);
        });

        if (found.length > 0) {
            found.forEach(item => {
                const card = document.createElement('div');
                const isWarning = item.name.includes("Vitamin D") && isFemale;
                card.className = `test-result-card ${isWarning ? 'warning-female' : ''}`;
                card.innerHTML = `
                    <h4>📋 ${item.name}</h4>
                    <p>${item.getNotes(isFemale)}</p>
                `;
                listDiv.appendChild(card);
            });
        } else {
            listDiv.innerHTML = `
                <div class="test-result-card" style="border-right-color: #f59e0b;">
                    <h4>لم تظهر التحاليل بدقة كافية</h4>
                    <p>اضغطي زر (تدوير يمين 🔄) ثم (إعادة الفحص) لمطابقة اتجاه السطور أفقياً مع الكاميرا.</p>
                </div>
            `;
        }

        sec.style.display = 'block';
        sec.scrollIntoView({ behavior: 'smooth' });
    }
</script>
