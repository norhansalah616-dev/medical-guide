<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الماسح الذكي لتحضيرات التحاليل الطبية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #0d5c58 0%, #063836 100%);
            --primary: #00bfa5;
            --accent: #f59e0b;
            --card-bg: #114b48;
            --text-main: #ffffff;
            --text-sub: #b2dfdb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-main);
            padding: 20px 15px 60px;
        }

        .container { max-width: 550px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 25px; }
        header h1 { font-size: 1.35rem; font-weight: 800; margin-bottom: 6px; }
        header p { font-size: 0.85rem; color: var(--text-sub); }

        .controls-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px 16px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .gender-options { display: flex; gap: 20px; margin-bottom: 18px; align-items: center; }
        .gender-options label { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; cursor: pointer; }

        .upload-area { display: flex; flex-direction: column; gap: 10px; }
        .btn-action {
            background-color: var(--primary);
            color: #00332c;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            display: block;
            width: 100%;
            transition: 0.2s;
        }
        .btn-action:hover { opacity: 0.92; }

        input[type="file"] { display: none; }

        #previewContainer { display: none; margin-top: 15px; text-align: center; }
        #imagePreview { max-width: 100%; max-height: 260px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.2); }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 25, 30, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-card {
            background: rgba(12, 30, 38, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 25px 35px;
            border-radius: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .spinner {
            width: 48px; height: 48px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .results-section { margin-top: 20px; display: none; }
        .results-section h3 { font-size: 1.1rem; margin-bottom: 12px; color: var(--accent); }

        .test-result-card {
            background: #ffffff;
            color: #263238;
            border-radius: 12px;
            padding: 15px 18px;
            margin-bottom: 12px;
            border-right: 6px solid var(--primary);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .test-result-card.warning-female { border-right-color: #e91e63; }
        .test-result-card h4 { color: #00796b; font-size: 1rem; margin-bottom: 6px; }
        .test-result-card p { font-size: 0.88rem; line-height: 1.6; }

        .alert-box {
            background: #ffebee;
            color: #c2185b;
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: 700;
            margin-top: 8px;
            font-size: 0.82rem;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>الماسح الذكي لتحضيرات التحاليل</h1>
        <p>فحص الروشتات الطبية ونظام DotCare تلقائياً عبر الذكاء الاصطناعي</p>
    </header>

    <div class="controls-card">
        <div class="gender-options">
            <span style="font-weight:700; font-size:0.92rem;">نوع الحالة:</span>
            <label><input type="radio" name="gender" value="أنثى" checked> أنثى (Female)</label>
            <label><input type="radio" name="gender" value="ذكر"> ذكر (Male)</label>
        </div>

        <div class="upload-area">
            <label for="cameraInput" class="btn-action">📸 فتح الكاميرا وتصوير الروشتة</label>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="processImage(this)">

            <label for="fileInput" class="btn-action" style="background-color: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.3);">📁 اختيار صورة من المعرض</label>
            <input type="file" id="fileInput" accept="image/*" onchange="processImage(this)">
        </div>

        <div id="previewContainer">
            <img id="imagePreview" alt="معاينة الروشتة">
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <h3>Loading...</h3>
            <p style="font-size: 0.85rem; color: #b2dfdb;">جارٍ قراءة الروشتة واستخراج التعليمات...</p>
        </div>
    </div>

    <div class="results-section" id="resultsSection">
        <h3>التحاليل المكتشفة وشروط التحضير:</h3>
        <div id="resultsList"></div>
    </div>
</div>

<script>
    const _kPart1 = "QVEuQWI4Uk42STFPTkh4";
    const _kPart2 = "Y3JRUm8xMkowLTlNUVBM";
    const _kPart3 = "bm5vSTluZXhNTEhhckJY";
    const _kPart4 = "anl3aTdrd0E=";
    const getSecureKey = () => atob(_kPart1 + _kPart2 + _kPart3 + _kPart4);

    function processImage(input) {
        if (!input.files || !input.files[0]) return;

        const file = input.files[0];
        const reader = new FileReader();

        reader.onload = (e) => {
            const preview = document.getElementById('imagePreview');
            preview.src = e.target.result;
            document.getElementById('previewContainer').style.display = 'block';

            const base64Data = e.target.result.split(',')[1];
            const mimeType = file.type || 'image/jpeg';
            analyzeWithGemini(base64Data, mimeType);
        };
        reader.readAsDataURL(file);
    }

    async function analyzeWithGemini(base64Image, mimeType) {
        const overlay = document.getElementById('loadingOverlay');
        overlay.style.display = 'flex';

        const gender = document.querySelector('input[name="gender"]:checked').value;

        const promptText = `
أنت استشاري تحاليل طبية وخبير في نظام DotCare.
المهمة:
1. افحص الصورة واستخرج كافة الفحوصات والتحاليل المكتوبة فيها بدقة، حتى لو كانت الصورة رأسية أو مائلة أو خط يد أو مطبوعة باختصارات (مثل: ALBUMIN, AST, SGOT, BUN, CBC, URINE, CREATININE, POTASSIUM, SODIUM, STOOL, VITAMIN D, ULTRASOUND... إلخ).
2. حدد شروط التحضير والسحب لكل فحص باللغة العربية بأسلوب واضح وسهل للمريض.
3. حالة المريض الحالية: [${gender}].
   - إذا وُجد تحليل Vitamin D أو V.D وكانت الحالة (أنثى): يجب التنبيه بوضوح أنه لا يتم السحب أثناء فترة الدورة الشهرية (البريود)، ويتم السحب بعد الانتهاء منها بـ 48 ساعة.
   - إذا كان التحليل يتطلب صياماً، حدد ساعات الصيام بدقة وشرب الماء فقط.

أخرج النتيجة بصيغة JSON فقط كالتالي دون أي مقدمات أو علامات إضافية:
[
  {
    "test_name": "اسم التحليل مع اختصاره",
    "instructions": "شروط التحضير والسحب بالتفصيل",
    "is_critical_female": true
  }
]`;

        try {
            // تم التحديث للموديل المطلوب بالضبط في رسالة الخطأ
            const endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent";
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-goog-api-key': getSecureKey()
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: promptText },
                            { inlineData: { mimeType: mimeType, data: base64Image } }
                        ]
                    }]
                })
            });

            const data = await response.json();
            overlay.style.display = 'none';

            if (!response.ok) {
                alert('خطأ في الخدمة: ' + (data.error ? data.error.message : 'تعذر الاتصال'));
                return;
            }

            let textResponse = data.candidates[0].content.parts[0].text;
            textResponse = textResponse.replace(/```json/g, '').replace(/```/g, '').trim();
            const results = JSON.parse(textResponse);
            displayResults(results);

        } catch (error) {
            overlay.style.display = 'none';
            alert('حدث خطأ أثناء فحص الصورة: ' + error.message);
            console.error(error);
        }
    }

    function displayResults(tests) {
        const resultsList = document.getElementById('resultsList');
        const resultsSection = document.getElementById('resultsSection');
        resultsList.innerHTML = '';

        if (!Array.isArray(tests) || tests.length === 0) {
            resultsList.innerHTML = '<div class="test-result-card"><p>لم يتم العثور على تحاليل واضحة في الصورة.</p></div>';
        } else {
            tests.forEach(item => {
                const card = document.createElement('div');
                card.className = `test-result-card ${item.is_critical_female ? 'warning-female' : ''}`;
                card.innerHTML = `
                    <h4>📋 ${item.test_name}</h4>
                    <p>${item.instructions}</p>
                    ${item.is_critical_female ? '<div class="alert-box">⚠️ تنبيه خاص بالحالة (أنثى): مراعاة موعد الدورة الشهرية</div>' : ''}
                `;
                resultsList.appendChild(card);
            });
        }

        resultsSection.style.display = 'block';
        resultsSection.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
