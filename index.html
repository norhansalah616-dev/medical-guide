<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الماسح الذكي لتحضيرات التحاليل الطبية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #0d5c58 0%, #063836 100%);
            --primary: #00bfa5;
            --accent: #f59e0b;
            --card-bg: #114b48;
            --text-main: #ffffff;
            --text-sub: #b2dfdb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-main);
            padding: 20px 15px 60px;
        }

        .container { max-width: 550px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 1.35rem; font-weight: 800; margin-bottom: 5px; }
        header p { font-size: 0.85rem; color: var(--text-sub); }

        .controls-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .api-input-group {
            margin-bottom: 14px;
        }

        .api-input-group label {
            display: block;
            font-size: 0.82rem;
            color: var(--text-sub);
            margin-bottom: 5px;
        }

        .api-input-group input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.25);
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }

        .gender-options {
            display: flex;
            gap: 15px;
            margin-bottom: 14px;
        }

        .gender-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.88rem;
            cursor: pointer;
        }

        .upload-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-action {
            background-color: var(--primary);
            color: #00332c;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            display: block;
            width: 100%;
        }

        input[type="file"] { display: none; }

        #previewContainer {
            display: none;
            margin-top: 15px;
            text-align: center;
        }

        #imagePreview {
            max-width: 100%;
            max-height: 250px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 25, 30, 0.82);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-card {
            background: rgba(12, 30, 38, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 24px 30px;
            border-radius: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .spinner {
            width: 46px; height: 46px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .results-section { margin-top: 20px; display: none; }
        .results-section h3 { font-size: 1.05rem; margin-bottom: 12px; color: var(--accent); }

        .test-result-card {
            background: #ffffff;
            color: #263238;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            border-right: 6px solid var(--primary);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .test-result-card.warning-female { border-right-color: #e91e63; }
        .test-result-card h4 { color: #00796b; font-size: 0.98rem; margin-bottom: 5px; }
        .test-result-card p { font-size: 0.86rem; line-height: 1.6; }

        .alert-box {
            background: #ffebee;
            color: #c2185b;
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: 700;
            margin-top: 8px;
            font-size: 0.82rem;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>الماسح الذكي لتحضيرات التحاليل</h1>
        <p>تحليل الروشتات بخط اليد ونظام DotCare عبر الذكاء الاصطناعي</p>
    </header>

    <div class="controls-card">
        <div class="api-input-group">
            <label>مفتاح الذكاء الاصطناعي المجاني (Gemini API Key):</label>
            <input type="password" id="apiKeyInput" placeholder="الصقي المفتاح هنا" onchange="saveKey(this.value)">
        </div>

        <div class="gender-options">
            <span style="font-weight:600; font-size:0.9rem;">الحالة:</span>
            <label><input type="radio" name="gender" value="أنثى" checked> أنثى (Female)</label>
            <label><input type="radio" name="gender" value="ذكر"> ذكر (Male)</label>
        </div>

        <div class="upload-area">
            <label for="cameraInput" class="btn-action">📸 فتح الكاميرا وتصوير الروشتة</label>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="processImage(this)">

            <label for="fileInput" class="btn-action" style="background-color: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.3);">📁 اختيار صورة من المعرض</label>
            <input type="file" id="fileInput" accept="image/*" onchange="processImage(this)">
        </div>

        <div id="previewContainer">
            <img id="imagePreview" alt="معاينة الروشتة">
        </div>
    </div>

    <!-- مؤشر التحميل -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <h3>Loading...</h3>
            <p id="loadingStatus" style="font-size: 0.85rem; color: #b2dfdb;">جارٍ فحص الروشتة واستخراج الشروط عبر الذكاء الاصطناعي...</p>
        </div>
    </div>

    <!-- قسم النتائج -->
    <div class="results-section" id="resultsSection">
        <h3>التحاليل المكتشفة وتعليمات التحضير:</h3>
        <div id="resultsList"></div>
    </div>
</div>

<script>
    // وضع المفتاح الخاص بكِ تلقائياً
    const defaultKey = "AQ.Ab8RN6KAiBSRAVjzIGKpBqwwXilXM9Yh7XSNC4dZl6jQ5tqW2A";

    window.onload = () => {
        const savedKey = localStorage.getItem('gemini_api_key') || defaultKey;
        document.getElementById('apiKeyInput').value = savedKey;
        localStorage.setItem('gemini_api_key', savedKey);
    };

    function saveKey(val) {
        localStorage.setItem('gemini_api_key', val.trim());
    }

    function processImage(input) {
        if (!input.files || !input.files[0]) return;

        const key = document.getElementById('apiKeyInput').value.trim();
        if (!key) {
            alert('يرجى وضع المفتاح في الخانة المخصصة.');
            return;
        }

        const file = input.files[0];
        const reader = new FileReader();

        reader.onload = (e) => {
            const preview = document.getElementById('imagePreview');
            preview.src = e.target.result;
            document.getElementById('previewContainer').style.display = 'block';

            const base64Data = e.target.result.split(',')[1];
            const mimeType = file.type || 'image/jpeg';
            analyzeWithGemini(base64Data, mimeType, key);
        };
        reader.readAsDataURL(file);
    }

    async function analyzeWithGemini(base64Image, mimeType, key) {
        const overlay = document.getElementById('loadingOverlay');
        overlay.style.display = 'flex';

        const gender = document.querySelector('input[name="gender"]:checked').value;

        const systemPrompt = `
أنت استشاري تحاليل طبية ونظام الدوت كير (DotCare).
المهمة:
1. اقرأ الصورة المرفقة واستخرج كافة الفحوصات والتحاليل المكتوبة فيها بدقة، حتى لو كانت الورقة رأسية أو مائلة أو مكتوبة باختصارات (مثل: ALBUMIN, AST, SGOT, BUN, CBC, URINE, CREATININE, POTASSIUM, SODIUM, STOOL, VITAMIN D, ULTRASOUND... إلخ).
2. استخرج شروط التحضير والسحب لكل فحص باللغة العربية.
3. حالة المريض: [${gender}].
   - تنبيه: إذا وُجد Vitamin D والحالة (أنثى)، نبّه بوضوح: لا يتم السحب أثناء فترة البريود، ويتم بعد انتهائها بـ 48 ساعة.
   - وضح شروط الصيام وساعاته بدقة لكل تحليل يتطلب ذلك.

أعد النتيجة بصيغة JSON فقط:
[
  {
    "test_name": "اسم التحليل مع اختصاره",
    "instructions": "شروط التحضير والسحب بالتفصيل",
    "is_critical_female": true
  }
]`;

        try {
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent`;
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-goog-api-key': key
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: systemPrompt },
                            {
                                inlineData: {
                                    mimeType: mimeType,
                                    data: base64Image
                                }
                            }
                        ]
                    }],
                    generationConfig: {
                        responseMimeType: "application/json"
                    }
                })
            });

            const data = await response.json();
            overlay.style.display = 'none';

            if (!response.ok) {
                const errMsg = data.error ? data.error.message : 'خطأ غير معروف في الخدمة';
                alert('خطأ من السيرفر: ' + errMsg);
                return;
            }

            if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                const textResponse = data.candidates[0].content.parts[0].text;
                const results = JSON.parse(textResponse);
                displayResults(results);
            } else {
                alert('تعذر استخراج البيانات من الصورة. تأكدي من إضاءة الورقة ووضوحها.');
            }
        } catch (error) {
            overlay.style.display = 'none';
            alert('حدث خطأ في الاتصال: ' + error.message);
            console.error(error);
        }
    }

    function displayResults(tests) {
        const resultsList = document.getElementById('resultsList');
        const resultsSection = document.getElementById('resultsSection');
        resultsList.innerHTML = '';

        if (!Array.isArray(tests) || tests.length === 0) {
            resultsList.innerHTML = '<div class="test-result-card"><p>لم يتم العثور على تحاليل في الصورة.</p></div>';
        } else {
            tests.forEach(item => {
                const card = document.createElement('div');
                card.className = `test-result-card ${item.is_critical_female ? 'warning-female' : ''}`;
                card.innerHTML = `
                    <h4>📋 ${item.test_name}</h4>
                    <p>${item.instructions}</p>
                    ${item.is_critical_female ? '<div class="alert-box">⚠️ تنبيه خاص بالحالة (أنثى): مراعاة موعد الدورة الشهرية</div>' : ''}
                `;
                resultsList.appendChild(card);
            });
        }

        resultsSection.style.display = 'block';
        resultsSection.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
